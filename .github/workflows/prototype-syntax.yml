name: Phase 1 static controls

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-controls:
    name: Syntax, generated roadmap, and P0 controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse control tools
        run: |
          node --check tools/build-wiki.mjs
          node --check tools/generate_phase1_roadmap_manifest.mjs
          node --check tools/P0-generate-task-artifacts.mjs
          node --check tools/sync_phase1_github.mjs
          node --check tools/P0-validate-execution-controls.mjs
      - name: Parse frozen v10 prototype JavaScript
        run: npm --prefix prototypes/calendar-ui run check:v10
      - name: Regenerate roadmap projections
        run: |
          node tools/generate_phase1_roadmap_manifest.mjs
          node tools/P0-generate-task-artifacts.mjs
          node tools/generate_phase1_roadmap_manifest.mjs
      - name: Reject uncommitted generated drift
        run: git diff --exit-code -- docs/project/PHASE1-ROADMAP-MANIFEST.json docs/project/PHASE1-RELEASE-PLAN.md docs/project/P0-PHASE1-TASK-ARTIFACT-REGISTER.json docs/work-items
      - name: Validate P0 execution controls
        run: node tools/P0-validate-execution-controls.mjs
      - name: Render safe GitHub sync plan
        run: node tools/sync_phase1_github.mjs
