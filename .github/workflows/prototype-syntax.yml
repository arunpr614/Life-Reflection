name: Prototype syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  v10-syntax:
    name: v10 JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: prototypes/calendar-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse v10 JavaScript
        run: npm run check:v10
